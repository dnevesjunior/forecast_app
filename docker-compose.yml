services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
